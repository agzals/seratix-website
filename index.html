<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Ikon: favicon.ico untuk browser lama/tab, PNG 32px untuk browser modern, apple-touch-icon untuk iOS -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Seratix | Digital Solutions &amp; Automation</title>
    <meta name="description" content="Seratix menyediakan undangan digital, website event, otomatisasi proses bisnis, dashboard, dan integrasi omnichannel, serta Seratix Hound: inbox WhatsApp + Instagram untuk tim kecil." />
    <meta name="theme-color" content="#ffffff" />

    <!-- Pratinjau saat link dibagikan. %VITE_SITE_URL% diganti Vite saat build (isi di .env / Environment Variables Vercel). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seratix" />
    <meta property="og:title" content="Seratix | Momen Berkesan. Bisnis Lebih Efisien." />
    <meta property="og:description" content="Undangan digital, otomatisasi bisnis, dan Seratix Hound, inbox WhatsApp + Instagram untuk tim kecil." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Pasang tema sebelum React jalan agar layar tidak berkedip
      (function () {
        try {
          var saved = localStorage.getItem('seratix-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
